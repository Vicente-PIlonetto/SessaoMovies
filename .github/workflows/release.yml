name: Release

# Ao enviar uma tag v* (ex.: v1.0.0), compila o APK de release e cria a versão no GitHub com ele anexado.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir a chave do TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::O secret TMDB_API_KEY não está configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Testes
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compilar o APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          PIX_KEY: ${{ secrets.PIX_KEY }}
          PIX_NAME: ${{ secrets.PIX_NAME }}
          PIX_CITY: ${{ secrets.PIX_CITY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Criar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/SessãoMovies-*-release.apk SessãoMovies.apk
          # O "#..." é o nome exibido na página da versão.
          gh release create "$GITHUB_REF_NAME" "SessãoMovies.apk#SessãoMovies.apk" \
            --title "Sessão ${GITHUB_REF_NAME#v}" \
            --generate-notes
